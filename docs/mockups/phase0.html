<!doctype html>
<html lang="en" data-pal="teal" data-lang="ja" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pontino — Phase 0 mockups</title>
<!-- Mockup only: fonts fall back to system fonts. The real app bundles Nunito + M PLUS Rounded 1c locally. Icons are emoji placeholders. -->
<style>
:root{
  --ok:#2E9E5B; --ok-soft:#DDF5E6; --bad:#D9534F; --bad-soft:#FBE3E1;
  --streak:#FF8A3D; --xp:#F2B01E; --river:#BFE6F2;
  --bg:#F3F5F7; --paper:#FFFFFF; --card:#FFFFFF; --ink:#1D2230; --muted:#667085; --line:#E4E7EC; --lock:#D5D9E0; --lock-edge:#B8BEC9;
  --font: "Nunito","SF Pro Rounded",ui-rounded,"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Segoe UI",system-ui,sans-serif;
}
[data-pal=teal]{--brand:#0C8388;--brand-edge:#075E63;--brand-soft:#D9F1F1}
[data-pal=coral]{--brand:#D9442F;--brand-edge:#A52E1D;--brand-soft:#FCE4DF}
[data-pal=blue]{--brand:#4660E0;--brand-edge:#2F44AD;--brand-soft:#E3E8FD}
[data-lang=ja]{--accent:#E8452C;--accent2:#2E4A8B;--paper:#FBF8F1;--pat:rgba(46,74,139,.10)}
[data-lang=it]{--accent:#C8643C;--accent2:#6F7F2F;--paper:#FFF8EC;--pat:rgba(200,100,60,.10)}
[data-mode=dark]{--bg:#0E1116;--paper:#161B22;--card:#1F2630;--ink:#F1F3F6;--muted:#9AA4B2;--line:#2C3541;--lock:#3A4350;--lock-edge:#2A313B;--river:#1E4A5A;--ok-soft:#173A27;--bad-soft:#44201F}
[data-mode=dark][data-pal=teal]{--brand:#19A5AB;--brand-edge:#0C6E73;--brand-soft:#12383A}
[data-mode=dark][data-pal=coral]{--brand:#EC5A45;--brand-edge:#A8331F;--brand-soft:#432019}
[data-mode=dark][data-pal=blue]{--brand:#6C82F2;--brand-edge:#3B4FB8;--brand-soft:#1F274D}
[data-lang=ja] .it{display:none!important} [data-lang=it] .ja{display:none!important}

*{box-sizing:border-box;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.controls{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.controls h1{font-size:18px;font-weight:900;margin-right:auto}
.seg{display:inline-flex;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{font:inherit;font-weight:800;font-size:13px;color:var(--muted);background:none;border:0;border-radius:10px;padding:8px 12px;min-height:36px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.screens{display:flex;flex-wrap:wrap;gap:32px 28px;justify-content:center;padding:28px 16px 60px}
figure{width:min(375px,100%)} figcaption{font-weight:800;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px 6px}
.phone{position:relative;height:760px;border-radius:36px;overflow:hidden;background:var(--paper);border:1px solid var(--line);box-shadow:0 18px 40px rgba(16,24,40,.12);display:flex;flex-direction:column}
.scroll{flex:1;overflow:hidden;padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px}
.pattern{position:absolute;inset:0 0 auto 0;height:150px;pointer-events:none;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
[data-lang=ja] .pattern{background:radial-gradient(circle at 50% 100%,transparent 9px,var(--pat) 10px,transparent 11px,transparent 15px,var(--pat) 16px,transparent 17px) 0 0/36px 18px,radial-gradient(circle at 50% 100%,transparent 9px,var(--pat) 10px,transparent 11px,transparent 15px,var(--pat) 16px,transparent 17px) 18px 9px/36px 18px}
[data-lang=it] .pattern{background:linear-gradient(45deg,var(--pat) 25%,transparent 25% 75%,var(--pat) 75%) 0 0/28px 28px,linear-gradient(45deg,var(--pat) 25%,transparent 25% 75%,var(--pat) 75%) 14px 14px/28px 28px}

/* top bar */
.top{position:relative;display:flex;align-items:center;gap:8px;padding:16px 16px 0}
.lang{display:flex;align-items:center;gap:6px;font-weight:900;font-size:14px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 12px;min-height:40px}
.lang i{width:18px;height:18px;border-radius:50%;background:var(--accent);box-shadow:inset 0 0 0 5px #fff,inset 0 0 0 18px var(--accent)}
[data-lang=it] .lang i{background:linear-gradient(90deg,#3E8E55 33%,#fff 33% 66%,#C8402F 66%);box-shadow:0 0 0 1px var(--line)}
.stat{margin-left:auto;display:flex;gap:12px;font-weight:900;font-size:15px} .stat span{display:flex;align-items:center;gap:3px}
.c-streak{color:var(--streak)} .c-xp{color:var(--xp)} .c-br{color:var(--brand)}

/* components */
.card{position:relative;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px}
.h{font-weight:900;font-size:20px;line-height:1.2} .sub{color:var(--muted);font-size:14px;font-weight:600;line-height:1.35}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.btn{display:block;width:100%;font:inherit;font-weight:900;font-size:17px;letter-spacing:.02em;color:#fff;background:var(--brand);border:0;border-radius:16px;padding:14px;min-height:52px;box-shadow:0 5px 0 var(--brand-edge);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--brand-edge)}
.btn.ghost{background:var(--card);color:var(--brand);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 #1F7742}
.bar{height:14px;border-radius:999px;background:var(--line);overflow:hidden} .bar>i{display:block;height:100%;border-radius:999px;background:var(--brand)}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;border-radius:999px;padding:7px 12px;background:var(--brand-soft);color:var(--brand)}
.chip.off{background:transparent;border:2px solid var(--line);color:var(--muted);padding:5px 10px}
.row{display:flex;align-items:center;gap:12px}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;font-weight:700;font-size:15px;line-height:1.35;flex:1}
.bubble:before{content:"";position:absolute;left:-9px;top:22px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.pontino{flex:none;width:84px} .pontino svg{display:block;width:100%;overflow:visible}
@media (prefers-reduced-motion:no-preference){.pontino.bounce svg{animation:bob 2.4s ease-in-out infinite}}
@keyframes bob{50%{transform:translateY(-4px)}}
.ring{--p:60;width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:900;font-size:15px;background:radial-gradient(closest-side,var(--card) 74%,transparent 76%),conic-gradient(var(--brand) calc(var(--p)*1%),var(--line) 0)}
.tabs{display:flex;background:var(--card);border-top:2px solid var(--line);padding:6px 4px 18px}
.tabs div{flex:1;text-align:center;font-size:11px;font-weight:800;color:var(--muted);min-height:44px;padding-top:4px} .tabs b{display:block;font-size:20px;line-height:1.2;filter:grayscale(1);opacity:.6}
.tabs .on{color:var(--brand)} .tabs .on b{filter:none;opacity:1}
ruby rt{font-size:.55em;font-weight:700;color:var(--muted)}
.jp{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif}

/* home */
.count{background:var(--accent2);border-color:transparent;color:#fff;overflow:hidden}
.count .big{font-size:40px;font-weight:900;line-height:1} .count .sub{color:rgba(255,255,255,.82)}
.count .sun{position:absolute;right:-26px;top:-26px;width:110px;height:110px;border-radius:50%;background:var(--accent);opacity:.95}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{padding:12px} .mini .h{font-size:15px} .mini .sub{font-size:12px}

/* path */
.path{position:relative;flex:1;margin:0 -16px}
.path svg.river{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:900;color:#fff;background:var(--brand);box-shadow:0 6px 0 var(--brand-edge)}
.node.lock{background:var(--lock);box-shadow:0 6px 0 var(--lock-edge);color:var(--muted)}
.node.now{width:76px;height:76px;outline:5px solid var(--brand-soft);outline-offset:4px}
.node.str{background:var(--accent2);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.nl{position:absolute;font-size:13px;font-weight:800;line-height:1.25;width:130px} .nl small{display:block;color:var(--muted);font-weight:700}

/* lesson */
.lt{display:flex;align-items:center;gap:12px;padding:18px 16px 0} .lt .x{font-size:22px;color:var(--muted);font-weight:900;width:44px;height:44px;display:grid;place-items:center} .lt .bar{flex:1}
.slot{min-height:64px;border-bottom:2px solid var(--line);border-top:2px solid var(--line);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-content:center}
.tile{font:inherit;font-weight:800;font-size:18px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:9px 14px;min-height:46px;box-shadow:0 4px 0 var(--line)}
.tile.used{color:transparent;background:var(--line);box-shadow:none}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.sheet{margin-top:auto;background:var(--ok-soft);border-radius:24px 24px 0 0;padding:18px 16px 26px;display:flex;flex-direction:column;gap:12px}
.sheet .h{color:var(--ok)} .sheet .sub{color:var(--ink)}
.tip{background:var(--card);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:700;line-height:1.35}
.spk{flex:none;width:44px;height:44px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:18px;box-shadow:0 4px 0 var(--brand-edge)}

/* review */
.bars{display:flex;align-items:flex-end;gap:8px;height:84px} .bars div{flex:1;border-radius:8px 8px 4px 4px;background:var(--brand-soft);position:relative} .bars div.t{background:var(--brand)}
.bars span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;font-weight:800;color:var(--muted)}
.list>div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:2px solid var(--line);font-weight:800;font-size:15px} .list>div:last-child{border:0} .list small{color:var(--muted);font-weight:700;font-size:13px}

/* collections */
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stamp{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;font-weight:900;font-size:20px;line-height:1.1;color:var(--accent);border:3px double var(--accent);transform:rotate(-8deg)}
.stamp:nth-child(2n){transform:rotate(6deg);color:var(--accent2);border-color:var(--accent2)} .stamp small{display:block;font-size:10px;letter-spacing:.06em}
.stamp.no{border:3px dashed var(--lock);color:var(--lock-edge);transform:none;font-size:22px}
.regions{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.regions i{aspect-ratio:1;border-radius:10px;background:var(--line);display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:900;color:var(--muted)}
.regions i.a{background:var(--accent);color:#fff} .regions i.b{background:var(--accent2);color:#fff}
.badge{flex:1;text-align:center;font-size:11px;font-weight:800;color:var(--muted)} .badge b{display:grid;place-items:center;margin:0 auto 6px;width:56px;height:56px;border-radius:18px;font-size:26px;background:var(--brand-soft)} .badge.no b{background:var(--line);filter:grayscale(1);opacity:.5}

/* settings */
.set>div{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;border-bottom:2px solid var(--line);font-weight:800;font-size:15px} .set>div:last-child{border:0}
.tog{width:50px;height:30px;border-radius:999px;background:var(--brand);position:relative;flex:none} .tog:after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff} .tog.off{background:var(--lock)} .tog.off:after{right:auto;left:3px}
.s3{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;font-size:12px} .s3 span{padding:7px 9px;color:var(--muted)} .s3 .on{background:var(--brand);color:#fff}
</style>
</head>
<body>
<div class="controls">
  <h1>Pontino · Phase 0 mockups</h1>
  <div class="seg" data-k="pal" role="group" aria-label="Brand palette">
    <button data-v="teal" aria-pressed="true"><span class="sw" style="background:#0C8388"></span>A · Bridge Teal</button>
    <button data-v="coral"><span class="sw" style="background:#D9442F"></span>B · Sunset Coral</button>
    <button data-v="blue"><span class="sw" style="background:#4660E0"></span>C · Lagoon Blue</button>
  </div>
  <div class="seg" data-k="lang" role="group" aria-label="Language theme">
    <button data-v="ja" aria-pressed="true">日本語</button><button data-v="it">Italiano</button>

<div class="screens">

<!-- 1 HOME -->
<figure><figcaption>1 · Home</figcaption><div class="phone"><div class="pattern"></div>

    <div class="card count it"><div class="sun"></div><div class="eyebrow" style="color:#fff;opacity:.85">Road to B2</div>

      <div class="card mini row"><div class="ring" style="--p:60">9/15</div><div><div class="h">Daily goal</div><div class="sub">minutes today</div></div></div>

    </div>
  </div>
  <div class="tabs"><div class="on"><b>🏠</b>Home</div><div><b>🧭</b>Learn</div><div><b>🔁</b>Review</div><div><b>📔</b>Collections</div><div><b>👤</b>Profile</div></div>
</div></figure>

<!-- 2 PATH -->
<figure><figcaption>2 · Learn (path of bridges)</figcaption><div class="phone"><div class="pattern"></div>
  <div class="top"><div class="lang"><i></i><span class="ja">Trip Mode + A1</span><span class="it">B1</span></div>
    <div class="stat"><span class="c-streak">🔥 12</span><span class="c-br">🌉 3</span></div></div>
  <div class="scroll"><div class="path">
    <svg class="river" viewBox="0 0 375 600" preserveAspectRatio="none" aria-hidden="true"><path d="M110 -10 C110 80 270 90 270 170 S100 250 100 330 S270 410 270 490 S190 560 190 620" fill="none" stroke="var(--river)" stroke-width="46" stroke-linecap="round"/><path d="M110 -10 C110 80 270 90 270 170 S100 250 100 330 S270 410 270 490 S190 560 190 620" fill="none" stroke="var(--paper)" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round" opacity=".7"/></svg>

    <div class="node str" style="left:262px;top:150px">✓</div><div class="nl" style="left:90px;top:132px;text-align:right"><span class="ja">A1-02 Verbs in motion</span><span class="it">B1-06 Che succederà?</span><small>★★★☆☆</small></div>
    <div class="node" style="left:150px;top:250px">✓</div><div class="nl" style="left:196px;top:232px"><span class="ja">T01 Arrival</span><span class="it">B1-07 Il posto in cui…</span><small>★★☆☆☆</small></div>
    <div class="pontino bounce" style="position:absolute;left:36px;top:268px;width:70px"></div>
    <div class="node now" style="left:112px;top:356px"><span class="ja">🏪</span><span class="it">⚽</span></div><div class="nl" style="left:164px;top:334px"><span class="ja">T02 Konbini</span><span class="it">B1-08 Penso che sia…</span><small>Lesson 3 of 5 · you are here</small></div>
    <div class="node lock" style="left:258px;top:462px">🔒</div><div class="nl" style="left:84px;top:446px;text-align:right"><span class="ja">T03 Trains 1</span><span class="it">B1-09 Bisogna che…</span><small><span class="ja">Suica, platforms</span><span class="it">wishes, necessity</span></small></div>

  </div></div>
  <div class="tabs"><div><b>🏠</b>Home</div><div class="on"><b>🧭</b>Learn</div><div><b>🔁</b>Review</div><div><b>📔</b>Collections</div><div><b>👤</b>Profile</div></div>
</div></figure>

<!-- 3 LESSON -->
<figure><figcaption>3 · Lesson player (answer checked)</figcaption><div class="phone">
  <div class="lt"><div class="x">✕</div><div class="bar"><i style="width:62%"></i></div><span class="c-xp" style="font-weight:900">⚡ 35</span></div>
  <div class="scroll" style="padding-bottom:0">
    <div class="h"><span class="ja">Answer the clerk</span><span class="it">Complete the opinion</span></div>
    <div class="row" style="align-items:flex-start"><div class="pontino" style="width:68px"></div>
      <div class="bubble"><div class="row"><div class="spk">🔊</div>
        <div class="ja jp" style="font-size:20px"><ruby>袋<rt>ふくろ</rt></ruby>はご<ruby>利用<rt>りよう</rt></ruby>ですか？</div>
        <div class="it" style="font-size:18px">Penso che l'Inter ___ la favorita.</div></div></div></div>
    <div class="slot"><span class="ja"><button class="tile jp">はい、</button> <button class="tile jp">お願いします</button></span><span class="it"><button class="tile">sia</button></span></div>

      <div class="tip ja">👂 <b>ご利用ですか</b> is shop keigo for "will you use…?". You only need to recognise it.</div>

</div></figure>

<!-- 4 REVIEW -->
<figure><figcaption>4 · Review</figcaption><div class="phone"><div class="pattern"></div>
  <div class="top"><div class="lang"><i></i><span class="ja">Japanese ▾</span><span class="it">Italian ▾</span></div><div class="stat"><span class="c-streak">🔥 12</span></div></div>
  <div class="scroll">
    <div class="card"><div class="row"><div class="ring" style="--p:35;width:84px;height:84px;font-size:24px">23</div>
      <div><div class="h">cards due today</div><div class="sub">about 4 minutes · scheduled by FSRS</div></div></div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin:14px 0"><span class="chip">Words 12</span><span class="chip ja">Kanji 5</span><span class="chip it">False friends 5</span><span class="chip">Grammar 4</span><span class="chip">Phrases 2</span></div>
